' Глобальные параметры PlantUML для ПЗ (ГОСТ 7.32 п. 6.5.2 → ГОСТ 19.701-90 / ISO 5807).
' Подключается в scripts/render_puml.sh через -config.
skinparam monochrome true
skinparam shadowing false
skinparam roundcorner 0
skinparam dpi 72
skinparam defaultFontName "Liberation Serif"
skinparam defaultFontSize 11
skinparam defaultFontColor black
skinparam backgroundColor transparent
skinparam documentBackgroundColor transparent
skinparam ArrowColor black
skinparam ArrowThickness 1
skinparam activityStyle rectangle
skinparam activity {
  BackgroundColor white
  BorderColor black
  FontColor black
  BorderThickness 1
  DiamondBackgroundColor white
  DiamondBorderColor black
  BarColor black
}
skinparam activityDiamond {
  BackgroundColor white
  BorderColor black
}
skinparam note {
  BackgroundColor white
  BorderColor black
  FontColor black
}
skinparam partition {
  BackgroundColor white
  BorderColor black
  FontColor black
}
skinparam rectangle {
  BackgroundColor white
  BorderColor black
}
skinparam component {
  BackgroundColor white
  BorderColor black
}
skinparam package {
  BackgroundColor white
  BorderColor black
}
skinparam database {
  BackgroundColor white
  BorderColor black
}
skinparam cloud {
  BackgroundColor white
  BorderColor black
}
skinparam actor {
  BorderColor black
  FontColor black
}
skinparam usecase {
  BackgroundColor white
  BorderColor black
}
